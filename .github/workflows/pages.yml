name: Test and publish to GitHub Pages

# Runs the test suite, then publishes the static game to the gh-pages branch,
# which GitHub Pages serves at https://waterloolou.github.io/gravity-duel/
# A failing test stops the publish, so a broken build never goes live.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: |
          npm ci
          npm test

      - name: Assemble site
        run: |
          mkdir -p _site/src
          cp index.html style.css protocol.js manifest.json sw.js _site/
          cp -r icons _site/
          find src -maxdepth 1 -name '*.js' ! -name '*.test.js' ! -name 'profile-store.js' -exec cp {} _site/src/ \;
          touch _site/.nojekyll
          # Keep the custom domain set in Settings -> Pages (GitHub stores it
          # as a CNAME file on gh-pages; a fresh publish would otherwise drop it).
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null && git cat-file -e FETCH_HEAD:CNAME 2>/dev/null; then
            git show FETCH_HEAD:CNAME > _site/CNAME
          fi

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
